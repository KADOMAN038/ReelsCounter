name: Build ReelsCounter APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodları çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Android SDK ortam değişkenlerini ayarla
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Gradle Wrapper kur ve Debug APK derle
        run: |
          if [ ! -f "./gradlew" ]; then
            GRADLE_VER="8.10.2"
            curl -sSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-${GRADLE_VER}/bin/gradle wrapper --gradle-version ${GRADLE_VER}
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK dosyasını Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCounter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
